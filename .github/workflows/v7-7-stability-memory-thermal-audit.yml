name: V7.7 Stable Memory and Transient Reclaim AB (NO FLASH)
on:
  push:
    branches: [v7-7-stability-memory-thermal-audit]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  forensic-collector:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Syntax and guard checks
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/v7/AY_V77_Stability_Probe.sh
          dash -n scripts/v7/AY_V77_Stability_Probe.sh
          bash -n scripts/v7/AY_V77_Reclaim_AB_Test.sh
          dash -n scripts/v7/AY_V77_Reclaim_AB_Test.sh
          grep -Fq 'trap restore 0' scripts/v7/AY_V77_Reclaim_AB_Test.sh
          grep -Fq 'reclaim_progress_enabled=0' scripts/v7/AY_V77_Reclaim_AB_Test.sh
          grep -Fq 'reclaim_progress_enabled=1' scripts/v7/AY_V77_Reclaim_AB_Test.sh
          grep -Fq 'init.svc.vendor.thermal-hal' scripts/v7/AY_V77_Reclaim_AB_Test.sh
          python3 -m py_compile scripts/v7/AY_V77_Stability_Analyzer.py tests/test_v77_stability_analyzer.py scripts/v7/AY_V77_Reclaim_AB_Analyzer.py tests/test_v77_reclaim_ab_analyzer.py
          ! grep -Eq '^[[:space:]]*(reboot|poweroff|setprop|swapoff|swapon|fastboot|dd)[[:space:]]' scripts/v7/AY_V77_Stability_Probe.sh
          ! grep -Eq '^[[:space:]]*(reboot|poweroff|setprop|swapoff|swapon|fastboot|dd)[[:space:]]' scripts/v7/AY_V77_Reclaim_AB_Test.sh
      - name: Unit tests (memory PSI and fail-closed handling)
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_v77_stability_analyzer.py' -v
          python3 -m unittest discover -s tests -p 'test_v77_reclaim_ab_analyzer.py' -v
          echo 'PASS: no boot image, no partition flashing, only volatile opted-in memory-reclaim AB'

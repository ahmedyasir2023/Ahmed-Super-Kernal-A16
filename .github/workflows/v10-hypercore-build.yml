name: V10 AY HyperCore ARM64 Build

on:
  push:
    branches: [v10-ay-hypercore, v10-3-ay-memory-engine, v10-4-schedutil-fast-up]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v10-ay-hypercore-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  susfs-api6-core:
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    env:
      KERNEL_SHA: 10380039ddcd6ead841e1fc4ca744a2dd6e92fb8
      KSU_SHA: b933b1f728116a456fbebf27b6a8772a640cdf23
      SUSFS_SHA: 77905b5a071e6f3669e3b1814cea30147c0801da
      CLANG_URL: https://github.com/SA9990/Toolchain/releases/download/clang-r563880c/clang-r563880c.tar.gz
      CLANG_SHA256: 57b456636aa9c3f5e159bc1dd6eddd7c6de654281cad84376e408a5d35f91bab
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Validate project scripts before expensive source downloads
        run: |
          set -euo pipefail
          for script in scripts/v2/integrate_root.sh scripts/v3/stage_api6_susfs_core.sh scripts/v3/build_api6_susfs_core.sh; do
            bash -n "$script"
          done
          python3 -m py_compile scripts/v2/manual_hooks.py scripts/prepare_ksu_legacy.py scripts/port_susfs_patch.py scripts/verify_boot_dtb.py scripts/v3/patch_api6_susfs_logging.py scripts/v3/patch_api6_susfs_uname.py scripts/v3/patch_api6_susfs_appstate.py scripts/v3/patch_api6_susfs_path.py scripts/v3/validate_path_bridge.py scripts/v4/patch_dt2w_default.py scripts/v5/patch_ay_input_boost.py scripts/v5/validate_ay_input_boost.py scripts/v6/patch_screen_wake_boost.py scripts/v6/validate_screen_wake_boost.py scripts/v7/patch_deepdoze_600s.py scripts/v7/validate_deepdoze_600s.py scripts/v7/patch_v7_1_wake_race.py scripts/v7/validate_v7_1_wake_race.py scripts/v7/preflash_audit.py scripts/v7/patch_v7_1_1_panel_state.py scripts/v7/validate_v7_1_1_panel_state.py scripts/v7/patch_v7_2_zram_mmstat.py scripts/v7/validate_v7_2_zram_mmstat.py scripts/v7/patch_v7_2_boost_lock.py scripts/v7/validate_v7_2_boost_lock.py scripts/v7/patch_v7_3_kswapd_hotplug.py scripts/v7/validate_v7_3_kswapd_hotplug.py scripts/v7/validate_v7_3_idlesafe.py scripts/v7/patch_v7_4_zram_dedup_account.py scripts/v7/validate_v7_4_zram_dedup_account.py scripts/v7/patch_v7_5_reclaim_progress.py scripts/v7/validate_v7_5_reclaim_progress.py scripts/v7/patch_v7_6_reclaim_observability.py scripts/v7/validate_v7_6_reclaim_observability.py scripts/v7/patch_v7_7_reclaim_ab_guarded.py scripts/v7/validate_v7_7_reclaim_ab_guarded.py scripts/v8/patch_v8_hyperspeed.py scripts/v8/validate_v8_hyperspeed.py scripts/v8/patch_v8_1_ultrasmooth.py scripts/v8/validate_v8_1_ultrasmooth.py scripts/v9/patch_v9_foreground_smooth.py scripts/v9/validate_v9_foreground_smooth.py scripts/v9/patch_v9_1_bounded_reclaim.py scripts/v9/validate_v9_1_bounded_reclaim.py scripts/v9/patch_v9_2_power_suspend_telemetry.py scripts/v9/validate_v9_2_power_suspend_telemetry.py scripts/v9/patch_v9_2_deepdoze_boottime.py scripts/v9/validate_v9_2_deepdoze_boottime.py scripts/v10/patch_v10_boost_fastpath.py scripts/v10/validate_v10_boost_fastpath.py scripts/v10/patch_v10_policy_dedup.py scripts/v10/validate_v10_policy_dedup.py scripts/v10/patch_v10_3_memory_efficiency.py scripts/v10/validate_v10_3_memory_efficiency.py scripts/v10/patch_v10_4_schedutil_fast_up.py scripts/v10/validate_v10_4_schedutil_fast_up.py
          sh -n scripts/v7/ay_v74_reclaim_probe.sh
          sh -n scripts/v9/ay_v92_power_suspend_probe.sh
          echo 'Bash and Python source syntax checks passed'
          python3 scripts/v7/preflash_audit.py --self-test

      - name: Install build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential git python3 bc bison flex libssl-dev libelf-dev libncurses-dev curl ca-certificates tar gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu ccache rsync pahole device-tree-compiler gzip xz-utils
          mkdir -p audit

      - name: Reuse pinned Android Clang 21
        id: clang-cache
        uses: actions/cache@v4
        with:
          path: toolchain
          key: android-clang-r563880c-linux-x86_64-v1

      - name: Fetch and validate Android Clang 21 if uncached
        if: steps.clang-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          curl --fail --location --retry 5 "$CLANG_URL" -o /tmp/toolchain.tar.gz
          echo "$CLANG_SHA256  /tmp/toolchain.tar.gz" | sha256sum --check -
          mkdir -p toolchain
          tar -xzf /tmp/toolchain.tar.gz -C toolchain
          rm -f /tmp/toolchain.tar.gz

      - name: Verify Clang toolchain
        run: |
          set -euo pipefail
          CLANG_PATH="$(find -L toolchain -name clang -type f -print -quit)"
          test -n "$CLANG_PATH"
          CLANG_BIN="$(cd "$(dirname "$CLANG_PATH")" && pwd)"
          for name in clang clang++ ld.lld llvm-ar llvm-nm llvm-objcopy llvm-objdump llvm-strip; do test -x "$CLANG_BIN/$name"; done
          "$CLANG_BIN/clang" --version | tee audit/compiler.txt
          grep -q '21.0.0' audit/compiler.txt
          echo "CLANG_BIN=$CLANG_BIN" >> "$GITHUB_ENV"

      - name: Fetch pinned kernel and root sources with bounded shallow history
        run: |
          set -euo pipefail
          export GIT_TERMINAL_PROMPT=0

          fetch_pinned() {
            local dir="$1"
            local url="$2"
            local sha="$3"
            local fallback_ref="$4"
            local fetched=0
            mkdir -p "$dir"
            git -C "$dir" init
            git -C "$dir" remote add origin "$url"

            for attempt in 1 2; do
              echo "Fetching $dir at pinned commit $sha (attempt $attempt)"
              if timeout 15m git -C "$dir" -c protocol.version=2 -c http.lowSpeedLimit=1000 -c http.lowSpeedTime=60 fetch --progress --depth=1 --filter=blob:none --no-tags origin "$sha"; then
                fetched=1
                break
              fi
              sleep 5
            done

            if [ "$fetched" -ne 1 ]; then
              echo "Direct SHA fetch unavailable; using bounded branch history: $fallback_ref"
              timeout 15m git -C "$dir" -c protocol.version=2 fetch --progress --depth=1 --filter=blob:none --no-tags origin "$fallback_ref"
              if ! git -C "$dir" cat-file -e "$sha^{commit}" 2>/dev/null; then
                timeout 15m git -C "$dir" -c protocol.version=2 fetch --progress --deepen=200 --filter=blob:none --no-tags origin "$fallback_ref"
              fi
            fi

            git -C "$dir" checkout --detach "$sha"
            test "$(git -C "$dir" rev-parse HEAD)" = "$sha"
            test -z "$(git -C "$dir" status --porcelain)"
          }

          fetch_pinned kernel https://github.com/realme-atoll/android_kernel_realme_sm7125.git "$KERNEL_SHA" refs/heads/aosp-16
          fetch_pinned KernelSU-Next https://github.com/KernelSU-Next/KernelSU-Next.git "$KSU_SHA" refs/heads/legacy
          fetch_pinned susfs4ksu https://github.com/kutemeikito/susfs4ksu.git "$SUSFS_SHA" refs/heads/kernel-4.14

          test -f kernel/arch/arm64/configs/atoll_defconfig
          test -f KernelSU-Next/kernel/Kbuild
          grep -qx 'SUBLEVEL = 336' kernel/Makefile

      - name: Stage SUSFS core and exact verified API6 root hooks
        run: bash scripts/v3/stage_api6_susfs_core.sh

      - name: Enable Realme double-tap from kernel touch init (no Android service)
        run: |
          set -euo pipefail
          python3 scripts/v4/patch_dt2w_default.py
          TOUCH=drivers/input/touchscreen/oppo_touchscreen/touchpanel_common_driver.c
          test "$(git -C kernel diff --numstat -- "$TOUCH")" = "$(printf '1\t1\t%s' "$TOUCH")"
          grep -Fq 'uint8_t DouTap_enable = 1;' "kernel/$TOUCH"
          grep -Fq 'GESTURE_ATTR(double_tap, DouTap_enable);' "kernel/$TOUCH"
          grep -Fq 'ts->gesture_enable = 1;' "kernel/$TOUCH"
          git -C kernel -c core.whitespace=-blank-at-eol diff --check

      - name: Enable bounded automatic input performance boost in Realme CPUFreq driver
        run: |
          set -euo pipefail
          python3 scripts/v5/patch_ay_input_boost.py
          python3 scripts/v5/validate_ay_input_boost.py
          CPU=drivers/cpufreq/cpu-boost.c
          test -n "$(git -C kernel diff -- "$CPU")"
          git -C kernel -c core.whitespace=-blank-at-eol diff --check

      - name: Integrate DRM screen-off saver and bounded instant wake response
        run: |
          set -euo pipefail
          python3 scripts/v6/patch_screen_wake_boost.py
          python3 scripts/v6/validate_screen_wake_boost.py
          grep -Fq 'MSM_DRM_BLANK_POWERDOWN' kernel/drivers/cpufreq/cpu-boost.c
          grep -Fq 'MSM_DRM_BLANK_UNBLANK' kernel/drivers/cpufreq/cpu-boost.c
          git -C kernel -c core.whitespace=-blank-at-eol diff --check

      - name: Apply 600-second DeepDoze policy cap and wake release
        run: |
          set -euo pipefail
          python3 scripts/v7/patch_deepdoze_600s.py
          python3 scripts/v7/validate_deepdoze_600s.py
          git -C kernel -c core.whitespace=-blank-at-eol diff --check

      - name: V7.1 wake/reblank race fix and ROM compatibility audit
        run: |
          set -euo pipefail
          python3 scripts/v7/patch_v7_1_wake_race.py
          python3 scripts/v7/validate_v7_1_wake_race.py
          # Re-run the base V7 contract AFTER V7.1 changes, not just before.
          # Fail here instead of wasting minutes compiling a broken contract.
          python3 scripts/v7/validate_deepdoze_600s.py
          git -C kernel -c core.whitespace=-blank-at-eol diff --check

      - name: Guard wake state when screen-off saver toggle changes
        run: |
          set -euo pipefail
          python3 scripts/v7/patch_v7_1_1_panel_state.py
          python3 scripts/v7/validate_v7_1_1_panel_state.py
          python3 scripts/v7/validate_deepdoze_600s.py
          python3 scripts/v7/validate_v7_1_wake_race.py
          git -C kernel -c core.whitespace=-blank-at-eol diff --check

      - name: V7.2 fix malformed ZRAM mm_stat and retain exact HyperSpeed defaults
        run: |
          set -euo pipefail
          python3 scripts/v7/patch_v7_2_zram_mmstat.py
          python3 scripts/v7/validate_v7_2_zram_mmstat.py
          python3 scripts/v7/patch_v7_2_boost_lock.py
          python3 scripts/v7/validate_v7_2_boost_lock.py
          python3 scripts/v6/validate_screen_wake_boost.py
          python3 scripts/v7/validate_deepdoze_600s.py
          python3 scripts/v7/validate_v7_1_1_panel_state.py
          git -C kernel -c core.whitespace=-blank-at-eol diff --check

      - name: V7.3 keep proven V7.2 offscreen behavior bit-identical and guard reclaim hotplug
        run: |
          set -euo pipefail
          mkdir -p audit
          sha256sum kernel/drivers/cpufreq/cpu-boost.c kernel/drivers/input/touchscreen/oppo_touchscreen/touchpanel_common_driver.c > audit/v7.4-idle-contract.sha256
          python3 scripts/v7/patch_v7_3_kswapd_hotplug.py
          python3 scripts/v7/validate_v7_3_kswapd_hotplug.py
          python3 scripts/v7/validate_v7_3_idlesafe.py
          sha256sum --check audit/v7.4-idle-contract.sha256
          python3 scripts/v7/validate_deepdoze_600s.py
          python3 scripts/v7/validate_v7_1_wake_race.py
          python3 scripts/v7/validate_v7_1_1_panel_state.py
          python3 scripts/v7/validate_v7_2_zram_mmstat.py
          python3 scripts/v7/validate_v7_2_boost_lock.py
          git -C kernel -c core.whitespace=-blank-at-eol diff --check

      - name: V7.4 repair physical ZRAM dedup compressed-byte accounting
        run: |
          set -euo pipefail
          python3 scripts/v7/patch_v7_4_zram_dedup_account.py
          python3 scripts/v7/validate_v7_4_zram_dedup_account.py
          python3 scripts/v7/validate_v7_3_idlesafe.py
          sha256sum --check audit/v7.4-idle-contract.sha256
          git -C kernel -c core.whitespace=-blank-at-eol diff --check

      - name: V7.5 restore watermark-driven kswapd reclaim; check screen-off power invariants
        run: |
          set -euo pipefail
          python3 scripts/v7/patch_v7_5_reclaim_progress.py
          python3 scripts/v7/validate_v7_5_reclaim_progress.py
          python3 scripts/v7/validate_v7_4_zram_dedup_account.py
          python3 scripts/v7/validate_v7_3_idlesafe.py
          sha256sum --check audit/v7.4-idle-contract.sha256
          git -C kernel -c core.whitespace=-blank-at-eol diff --check

      - name: V7.6 add read-only reclaim observability with no new timers or power changes
        run: |
          set -euo pipefail
          python3 scripts/v7/patch_v7_6_reclaim_observability.py
          python3 scripts/v7/validate_v7_6_reclaim_observability.py
          python3 scripts/v7/validate_v7_4_zram_dedup_account.py
          python3 scripts/v7/validate_v7_3_idlesafe.py
          sha256sum --check audit/v7.4-idle-contract.sha256
          git -C kernel -c core.whitespace=-blank-at-eol diff --check

      - name: V7.7 guard upstream reclaim with boot-default OFF, root-only A/B
        run: |
          set -euo pipefail
          python3 scripts/v7/patch_v7_7_reclaim_ab_guarded.py
          python3 scripts/v7/validate_v7_7_reclaim_ab_guarded.py
          python3 scripts/v7/validate_v7_4_zram_dedup_account.py
          python3 scripts/v7/validate_v7_3_idlesafe.py
          sha256sum --check audit/v7.4-idle-contract.sha256
          git -C kernel -c core.whitespace=-blank-at-eol diff --check

      - name: Apply V8 HyperSpeed and measured reclaim-watermark response (no power governor lock)
        run: |
          set -euo pipefail
          python3 scripts/v8/patch_v8_hyperspeed.py
          python3 scripts/v8/validate_v8_hyperspeed.py
          python3 scripts/v7/validate_v7_7_reclaim_ab_guarded.py
          python3 scripts/v7/validate_deepdoze_600s.py
          python3 scripts/v7/validate_v7_1_wake_race.py
          python3 scripts/v7/validate_v7_1_1_panel_state.py
          git -C kernel -c core.whitespace=-blank-at-eol diff --check

      - name: Stage V8.1 transition turbo and single-owner kswapd with root opt-outs
        run: |
          set -euo pipefail
          python3 scripts/v8/patch_v8_1_ultrasmooth.py
          python3 scripts/v8/validate_v8_1_ultrasmooth.py
          python3 scripts/v7/validate_v7_7_reclaim_ab_guarded.py
          python3 scripts/v7/validate_deepdoze_600s.py
          python3 scripts/v7/validate_v7_1_wake_race.py
          python3 scripts/v7/validate_v7_1_1_panel_state.py
          git -C kernel -c core.whitespace=-blank-at-eol diff --check

      - name: Stage V9 foreground boost coalescing and verify preserved power contracts
        run: |
          set -euo pipefail
          python3 scripts/v9/patch_v9_foreground_smooth.py
          python3 scripts/v9/validate_v9_foreground_smooth.py
          python3 scripts/v8/validate_v8_hyperspeed.py
          python3 scripts/v8/validate_v8_1_ultrasmooth.py
          python3 scripts/v7/validate_deepdoze_600s.py
          python3 scripts/v7/validate_v7_1_wake_race.py
          python3 scripts/v7/validate_v7_1_1_panel_state.py
          git -C kernel -c core.whitespace=-blank-at-eol diff --check

      - name: V9.1 bounded reclaim follow-through with 1s rate cap and root opt-out
        run: |
          set -euo pipefail
          # Keep the proven V9 CPUFreq and DT2W code byte-for-byte.
          sha256sum kernel/drivers/cpufreq/cpu-boost.c kernel/drivers/input/touchscreen/oppo_touchscreen/touchpanel_common_driver.c > audit/v9.1-idle-cpu-tp.sha256
          python3 scripts/v9/patch_v9_1_bounded_reclaim.py
          python3 scripts/v9/validate_v9_1_bounded_reclaim.py
          python3 scripts/v9/validate_v9_foreground_smooth.py
          python3 scripts/v8/validate_v8_1_ultrasmooth.py
          python3 scripts/v7/validate_deepdoze_600s.py
          sha256sum --check audit/v9.1-idle-cpu-tp.sha256
          git -C kernel -c core.whitespace=-blank-at-eol diff --check
          test "$(git -C kernel diff --name-only -- mm/vmscan.c)" = "mm/vmscan.c"

      - name: V9.2 RC2 suspend-aware DeepDoze + passive PM telemetry
        run: |
          set -euo pipefail
          python3 scripts/v9/patch_v9_2_power_suspend_telemetry.py
          python3 scripts/v9/validate_v9_2_power_suspend_telemetry.py
          python3 scripts/v9/validate_v9_1_bounded_reclaim.py
          python3 scripts/v9/validate_v9_foreground_smooth.py
          python3 scripts/v8/validate_v8_1_ultrasmooth.py
          python3 scripts/v7/validate_deepdoze_600s.py
          python3 scripts/v7/validate_v7_1_wake_race.py
          python3 scripts/v7/validate_v7_1_1_panel_state.py
          python3 scripts/v9/patch_v9_2_deepdoze_boottime.py
          python3 scripts/v9/validate_v9_2_deepdoze_boottime.py
          python3 scripts/v9/validate_v9_2_power_suspend_telemetry.py
          git -C kernel -c core.whitespace=-blank-at-eol diff --check
          test "$(git -C kernel diff --name-only -- drivers/cpufreq/cpu-boost.c)" = "drivers/cpufreq/cpu-boost.c"
          test -z "$(git -C kernel diff --name-only -- kernel/power/suspend.c drivers/base/power/wakeup.c drivers/cpuidle)"
          sha256sum kernel/drivers/cpufreq/cpu-boost.c > audit/v9.2-cpu-boost-source.sha256

      - name: V10.1 nonblocking same-profile boost renewal
        run: |
          set -euo pipefail
          python3 scripts/v10/patch_v10_boost_fastpath.py
          python3 scripts/v10/validate_v10_boost_fastpath.py
          python3 scripts/v9/validate_v9_2_deepdoze_boottime.py
          python3 scripts/v9/validate_v9_2_power_suspend_telemetry.py
          python3 scripts/v9/validate_v9_1_bounded_reclaim.py
          python3 scripts/v9/validate_v9_foreground_smooth.py
          python3 scripts/v8/validate_v8_1_ultrasmooth.py
          python3 scripts/v7/validate_v7_1_wake_race.py
          python3 scripts/v7/validate_v7_1_1_panel_state.py
          git -C kernel -c core.whitespace=-blank-at-eol diff --check

      - name: V10.2 deduplicate shared CPUFreq policy refreshes
        run: |
          set -euo pipefail
          python3 scripts/v10/patch_v10_policy_dedup.py
          python3 scripts/v10/validate_v10_policy_dedup.py
          python3 scripts/v10/validate_v10_boost_fastpath.py
          python3 scripts/v9/validate_v9_foreground_smooth.py
          python3 scripts/v9/validate_v9_2_deepdoze_boottime.py
          python3 scripts/v9/validate_v9_2_power_suspend_telemetry.py
          python3 scripts/v9/validate_v9_1_bounded_reclaim.py
          python3 scripts/v8/validate_v8_1_ultrasmooth.py
          python3 scripts/v7/validate_v7_1_wake_race.py
          python3 scripts/v7/validate_v7_1_1_panel_state.py
          git -C kernel -c core.whitespace=-blank-at-eol diff --check

      - name: V10.3 conservative memory reclaim defaults
        run: |
          set -euo pipefail
          python3 scripts/v10/patch_v10_3_memory_efficiency.py
          python3 scripts/v10/validate_v10_3_memory_efficiency.py
          python3 scripts/v9/validate_v9_1_bounded_reclaim.py
          python3 scripts/v10/validate_v10_policy_dedup.py
          python3 scripts/v10/validate_v10_boost_fastpath.py
          python3 scripts/v8/validate_v8_1_ultrasmooth.py
          python3 scripts/v7/validate_deepdoze_600s.py
          # V10.3 must only change mm/vmscan.c; CPU, touch, DT2W and DTB stay pinned.
          test "$(git -C kernel diff --name-only -- mm/vmscan.c)" = "mm/vmscan.c"
          git -C kernel -c core.whitespace=-blank-at-eol diff --check

      - name: V10.4 bounded schedutil upward response
        run: |
          set -euo pipefail
          python3 scripts/v10/patch_v10_4_schedutil_fast_up.py
          python3 scripts/v10/validate_v10_4_schedutil_fast_up.py
          python3 scripts/v10/validate_v10_3_memory_efficiency.py
          python3 scripts/v10/validate_v10_policy_dedup.py
          python3 scripts/v10/validate_v10_boost_fastpath.py
          python3 scripts/v9/validate_v9_2_deepdoze_boottime.py
          python3 scripts/v9/validate_v9_2_power_suspend_telemetry.py
          python3 scripts/v9/validate_v9_1_bounded_reclaim.py
          python3 scripts/v8/validate_v8_1_ultrasmooth.py
          python3 scripts/v7/validate_deepdoze_600s.py
          test "$(git -C kernel diff --name-only -- kernel/sched/cpufreq_schedutil.c)" = "kernel/sched/cpufreq_schedutil.c"
          git -C kernel -c core.whitespace=-blank-at-eol diff --check

      - name: Verify fail-closed API6 path-only source and permission contract
        run: python3 scripts/v3/validate_path_bridge.py
      - name: Compile ARM64 with official Root and isolated SUSFS path VFS hooks
        run: bash scripts/v3/build_api6_susfs_path.sh

      - name: Verify API6 Root and SUSFS core objects, plus original DTB
        run: |
          set -euo pipefail
          test -s kernel/out/arch/arm64/boot/Image.gz
          gzip -t kernel/out/arch/arm64/boot/Image.gz
          test -s kernel/out/vmlinux
          test -s kernel/out/drivers/kernelsu/kernelsu.o
          test -s kernel/out/fs/susfs.o
          # Verify the exactly scoped, read-only SUSFS metadata bridge is present.
          grep -Fq 'arg2 == CMD_SUSFS_SHOW_VERSION' kernel/kernel/sys.c
          grep -Fq 'arg2 == CMD_SUSFS_SHOW_ENABLED_FEATURES' kernel/kernel/sys.c
          grep -Fq 'u64 enabled_features = (1ULL << 0) | (1ULL << 8) | (1ULL << 9)' kernel/kernel/sys.c
          grep -Fq 'susfs_set_log(arg3 != 0)' kernel/kernel/sys.c
          grep -Fq 'susfs_set_uname(' kernel/kernel/sys.c
          grep -Fq 'CMD_SUSFS_SHOW_VARIANT' kernel/kernel/sys.c
          if git -C kernel diff --name-only | grep -Fq 'kernel/sys.c'; then
            echo 'Root-gated SUSFS path+uname+logging bridge staged; mount/kstat hiding deliberately disabled.'
          else
            echo 'Missing expected prctl bridge source'; exit 1
          fi
          test -s kernel/out/vmlinux
          grep -qx 'CONFIG_KSU=y' kernel/out/.config
          grep -qx 'CONFIG_KSU_MANUAL_HOOK=y' kernel/out/.config
          grep -qx 'CONFIG_KSU_SUSFS=y' kernel/out/.config
          grep -qx 'CONFIG_KSU_SUSFS_ENABLE_LOG=y' kernel/out/.config
          grep -qx 'CONFIG_KSU_SUSFS_SPOOF_UNAME=y' kernel/out/.config
          grep -qx 'CONFIG_KSU_SUSFS_PROC_TRACK=y' kernel/out/.config
          grep -qx 'CONFIG_KSU_SUSFS_SUS_PATH=y' kernel/out/.config
